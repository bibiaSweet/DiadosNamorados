<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartas para Ele 💕</title>
    <link rel="stylesheet" href="bia.css"> 
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav> 
            <div class="logo">💕 NOSSAS CARTAS </div>
            <ul> 
                <li><a href="bia-home.html">VOLTAR AO MENU</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <!-- Cartas Abertas -->
        <section id="cartas">
            <h2>Cartas Abertas</h2>
            <div class="botoes-cartas">
                <button onclick="abrirCarta('triste')">Para ler quando estiver triste</button>
                <button onclick="abrirCarta('saudade')">Para ler quando sentir saudade</button>
                <button onclick="abrirCarta('futuro')">Para ler daqui a 5 anos</button>
            </div>
            
            <div id="conteudo-carta" class="carta-oculta">
                <h3 id="titulo-carta"></h3>
                <p id="texto-carta"></p>
                <button onclick="fecharCarta()" class="btn-fechar">Guardar carta</button>
            </div>
        </section>
    </main>

    <footer> 
      <p>&copy; 2026, Polizel - Página de namoro</p>
    </footer>

    <!-- Chama o arquivo JS para os botões das cartas funcionarem -->
    <script src="bia.js"></script>
</body>
</html>
