<!DOCTYPE html>
<!--idioma português -->
<html lang="pt-br">
<head>
    <!-- aceitar acentos e emojis -->
    <meta charset="UTF-8">
    <!-- Ajusta tamanho do site para caber em telas de celulares e monitores -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título -->
    <title>Nosso Relacionamento &lt;3</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <!-- Conecta este arquivo HTML ao  arquivo de estilos (CSS) externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- caixa do título principal no topo da tela -->
    <div class="caixa-titulo">
        <!-- efeito de texto correndo/andando na tela de um lado para o outro -->
        <marquee scrollamount="6">💕 NOSSO RELACIONAMENTO 💕</marquee>
    </div>

    <!-- Cria a metade esquerda da tela (seção Bia) -->
    <div class="lado lado-bia">
        <!-- Título da seção da Bia -->
        <h2>NA VISÃO DA BIA </h2>
        <!-- Insere a foto de perfil da Bia puxando o arquivo de imagem -->
        <img src="paint2.png.png" alt="Foto da Bia" class="foto-perfil">
        <!-- Botão/Link para abrir a página específica do blog da Bia -->
        <a href="bia.html" class="btn-retro">Entrar no Blog</a>
    </div>

    <!-- Cria a metade direita da tela (seção Felipe) -->
    <div class="lado lado-felipe">
        <!-- Título da seção do Felipe -->
        <h2>Na visão do Felipe 🦖</h2>
        <!-- Botão/Link para abrir a página do sistema do Felipe -->
        <a href="felipe.html" class="btn-retro">Acessar Sistema</a>
    </div>

    <!-- Conecta a página a um arquivo JavaScript externo para funções interativas -->
    <script src="script.js"></script>
</body>
</html>
